<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Фруктовый Слот 777</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0b0b10;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .casino-card {
      background: linear-gradient(145deg, #1f1a24, #120f18);
      padding: 2.5rem;
      border-radius: 24px;
      box-shadow: 0 0 50px rgba(255, 215, 0, 0.15), inset 0 0 15px rgba(255, 215, 0, 0.1);
      text-align: center;
      max-width: 500px;
      width: 90%;
      border: 3px solid #ffd700;
      position: relative;
    }
    h1 {
      color: #ffd700;
      margin-top: 0;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      font-size: 2rem;
      letter-spacing: 2px;
    }
    .slots-window {
      background: #000;
      border: 4px solid #444;
      border-radius: 16px;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 1.5rem 0;
      box-shadow: inset 0 0 20px #000;
    }
    .slot {
      background: linear-gradient(180deg, #222, #111, #222);
      border: 2px solid #ffb700;
      border-radius: 12px;
      height: 100px;
      font-size: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: transform 0.05s;
    }
    .slot.blur {
      filter: blur(4px);
      transform: scaleY(1.1);
    }
    .status-box {
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 40px;
      margin-bottom: 1.5rem;
      color: #ffb700;
      text-shadow: 0 0 8px rgba(255, 183, 0, 0.4);
    }
    .win-jackpot {
      color: #00ff66 !important;
      animation: pulse 0.5s infinite alternate;
      text-shadow: 0 0 15px #00ff66 !important;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
    button {
      background: linear-gradient(180deg, #ff0055, #990033);
      color: #fff;
      border: 2px solid #ff6699;
      padding: 16px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(255, 0, 85, 0.4);
      transition: 0.1s;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 0, 85, 0.6);
    }
    button:active {
      transform: translateY(2px);
    }
    button:disabled {
      background: #444;
      border-color: #666;
      box-shadow: none;
      cursor: not-allowed;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="casino-card">
    <h1>🎰 CASINO 777 🎰</h1>
    
    <div class="slots-window">
      <div class="slot" id="slot1">7️⃣</div>
      <div class="slot" id="slot2">7️⃣</div>
      <div class="slot" id="slot3">7️⃣</div>
    </div>

    <div class="status-box" id="status">Испытай удачу!</div>

    <button id="spinBtn" onclick="spin()">КРУТИТЬ!</button>
  </div>

  <script>
    // Символы автомата (7️⃣ выпадает реже всех для азарта)
    const symbols = ["🍒", "🍋", "🍊", "🍇", "🔔", "💎", "7️⃣"];

    function spin() {
      const btn = document.getElementById('spinBtn');
      const s1 = document.getElementById('slot1');
      const s2 = document.getElementById('slot2');
      const s3 = document.getElementById('slot3');
      const status = document.getElementById('status');

      btn.disabled = true;
      status.className = "status-box";
      status.innerText = "Крутим барабаны...";

      s1.classList.add('blur');
      s2.classList.add('blur');
      s3.classList.add('blur');

      let counter = 0;
      const interval = setInterval(() => {
        s1.innerText = getRandomSymbol();
        s2.innerText = getRandomSymbol();
        s3.innerText = getRandomSymbol();
        counter++;

        if (counter > 20) {
          clearInterval(interval);

          const res1 = getRandomSymbol();
          const res2 = getRandomSymbol();
          const res3 = getRandomSymbol();

          s1.innerText = res1;
          s2.innerText = res2;
          s3.innerText = res3;

          s1.classList.remove('blur');
          s2.classList.remove('blur');
          s3.classList.remove('blur');

          checkWin(res1, res2, res3);
          btn.disabled = false;
        }
      }, 60);
    }

    function getRandomSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function checkWin(a, b, c) {
      const status = document.getElementById('status');
      
      if (a === "7️⃣" && b === "7️⃣" && c === "7️⃣") {
        status.innerText = "🔥 ДЖЕКПОТ! 777! ВЫ ВЫИГРАЛИ! 🔥";
        status.classList.add('win-jackpot');
      } else if (a === b && b === c) {
        status.innerText = "🎉 ТРОЙНОЙ ВЫИГРЫШ! 🎉";
        status.classList.add('win-jackpot');
      } else if (a === b || b === c || a === c) {
        status.innerText = "✨ Две совпали! Небольшой приз!";
      } else {
        status.innerText = "Эх, не повезло! Попробуй еще раз!";
      }
    }
  </script>
</body>
</html>
